# =============================================================================
#  AROVIA Platform — Docker Compose Infrastructure
#  Services: PostgreSQL · Redis · Apache Kafka (KRaft Mode)
# =============================================================================

version: "3.9"

networks:
  arovia-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Primary relational database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: arovia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arovia_db}
      POSTGRES_USER: ${POSTGRES_USER:-arovia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arovia_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - arovia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arovia_user} -d ${POSTGRES_DB:-arovia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis 7 — Pub/Sub, session caching, real-time bid events
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: arovia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-arovia_redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arovia-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-arovia_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Apache Kafka — KRaft Mode (no ZooKeeper required)
  # Single-node setup for development; scale with replicas in production.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: arovia-kafka
    restart: unless-stopped
    environment:
      # KRaft — combined controller + broker role
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Pre-create AROVIA platform topics
      KAFKA_CREATE_TOPICS: >-
        pitch.uploaded:1:1,
        pitch.evaluated:1:1,
        bid.placed:1:1,
        bid.accepted:1:1,
        session.started:1:1,
        session.ended:1:1,
        agent37.response:1:1
      CLUSTER_ID: arovia-kafka-cluster-001
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - arovia-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Kafka UI — Visual management console (dev only)
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: arovia-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: arovia-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks:
      - arovia-net
    profiles:
      - tools

  # ---------------------------------------------------------------------------
  # pgAdmin 4 — PostgreSQL management UI (dev only)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: arovia-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@arovia.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-arovia_admin}
    ports:
      - "5050:80"
    networks:
      - arovia-net
    profiles:
      - tools
