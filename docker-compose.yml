services:
  # =================================================================
  # DATABASE: PostgreSQL 16 (TSK-101, TSK-103, DB-201, DB-202, DB-203)
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: arovia-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arovia_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arovia_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-arovia_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - arovia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arovia_admin} -d ${POSTGRES_DB:-arovia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =================================================================
  # CACHE & REAL-TIME PUB/SUB: Redis 7 (TSK-101, TSK-303)
  # =================================================================
  redis:
    image: redis:7-alpine
    container_name: arovia-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arovia-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =================================================================
  # KAFKA CLUSTER (KRaft Mode - 3 Nodes - TSK-101, TSK-103)
  # =================================================================
  kafka-1:
    image: apache/kafka:3.7.0
    container_name: arovia-kafka-1
    restart: always
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-4L622nShTZaKmRINThIFtw}
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    networks:
      - arovia-network

  kafka-2:
    image: apache/kafka:3.7.0
    container_name: arovia-kafka-2
    restart: always
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-4L622nShTZaKmRINThIFtw}
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    networks:
      - arovia-network

  kafka-3:
    image: apache/kafka:3.7.0
    container_name: arovia-kafka-3
    restart: always
    ports:
      - "39092:39092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:39092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:39092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-4L622nShTZaKmRINThIFtw}
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    networks:
      - arovia-network

  # =================================================================
  # KAFKA TOPIC INITIALIZER HELPER
  # =================================================================
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: arovia-kafka-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka cluster to stabilize...'
      sleep 10
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic pitch.created --partitions 3 --replication-factor 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic pitch.live --partitions 3 --replication-factor 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic offer.submitted --partitions 3 --replication-factor 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic commitment.accepted --partitions 3 --replication-factor 3
      echo 'All AROVIA Kafka topics verified successfully!'
      "
    networks:
      - arovia-network

  # =================================================================
  # BACKEND API GATEWAY: FastAPI (TSK-102, TSK-301, TSK-302, TSK-303)
  # =================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arovia-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-arovia_admin}:${POSTGRES_PASSWORD:-arovia_secure_password_2026}@postgres:5432/${POSTGRES_DB:-arovia_db}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - SECRET_KEY=${SECRET_KEY:-arovia_super_secret_jwt_signature_key_2026_change_in_production}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arovia-network

  # =================================================================
  # KAFKA CONSUMER WORKER: Background Async Processor (TSK-304)
  # =================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: arovia-worker
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-arovia_admin}:${POSTGRES_PASSWORD:-arovia_secure_password_2026}@postgres:5432/${POSTGRES_DB:-arovia_db}
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - KAFKA_CONSUMER_GROUP=arovia-dealflow-group
    depends_on:
      - backend
      - kafka-1
    networks:
      - arovia-network

  # =================================================================
  # FRONTEND: Campus Pitch Showcase & Live Pitching Client (TSK-102)
  # =================================================================
  frontend:
    image: nginx:alpine
    container_name: arovia-frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - arovia-network

# =================================================================
# PERSISTENT VOLUMES (TSK-103)
# =================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_1_data:
    driver: local
  kafka_2_data:
    driver: local
  kafka_3_data:
    driver: local

# =================================================================
# NETWORK BRIDGING (TSK-102)
# =================================================================
networks:
  arovia-network:
    name: arovia-network
    driver: bridge
